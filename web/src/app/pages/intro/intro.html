<main class="intro">
  <section class="card">
    <p class="eyebrow">Meridiano Auto Finance</p>
    <h1>Cierre de venta: Ford Mustang</h1>
    <p class="lead">Ingresa tus datos para comenzar tu llamada de cierre.</p>

    <form [formGroup]="form" (ngSubmit)="startCall()" class="form" novalidate>
      <label class="field">
        <span>Nombre completo</span>
        <input
          type="text"
          formControlName="fullName"
          placeholder="Ej. John Smith"
          autocomplete="name"
        />
        @if (fieldInvalid('fullName')) {
          <span class="field-error">Ingresa tu nombre completo.</span>
        }
      </label>

      <label class="field">
        <span>Correo electrónico</span>
        <input
          type="email"
          formControlName="email"
          placeholder="tucorreo@ejemplo.com"
          autocomplete="email"
        />
        @if (fieldInvalid('email')) {
          <span class="field-error">Ingresa un correo válido.</span>
        }
      </label>

      @if (errorMessage()) {
        <p class="form-error">{{ errorMessage() }}</p>
      }

      <button type="submit" [disabled]="submitting()">
        {{ submitting() ? 'Conectando…' : 'Comenzar la llamada' }}
      </button>
    </form>

    <p class="fine-print">Se solicitará acceso a tu cámara y micrófono.</p>
  </section>
</main>
